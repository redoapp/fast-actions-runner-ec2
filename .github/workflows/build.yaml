concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: build/${{ github.ref }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: .github/workflows/build/build
    timeout-minutes: 30
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    name: Release
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::260890374087:role/FareCi
          role-session-name: Github-Build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Release
        run: .github/workflows/build/release
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
